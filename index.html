<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product List (Trial Version)</title>
<style>
  /* ========== UGLY MODE ========== */
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #ff00ff; /* hot magenta */
    color: #00ff00; /* lime green text */
    font-family: 'Comic Sans MS', 'Comic Sans', cursive, sans-serif;
    margin: 10px;
    border: 10px dashed yellow;
    min-height: 100vh;
  }
  h1, h2, h3 { color: red; text-shadow: 2px 2px #000; }
  button {
    background: black;
    color: orange;
    border: 3px ridge cyan;
    font-family: 'Impact', sans-serif;
    font-size: 14px;
    padding: 5px 10px;
    cursor: pointer;
  }
  .container { max-width: 100%; overflow-x: auto; }
  .filter-bar { display: flex; gap: 5px; flex-wrap: wrap; margin: 15px 0; }
  .filter-btn { padding: 5px 10px; }
  .filter-btn.active { background: #ff0; color: #000; border-color: #f00; }
  #grid { display: flex; flex-wrap: wrap; gap: 15px; }
  .card {
    border: 5px double lime;
    background: #000;
    padding: 8px;
    width: 220px;
    text-align: center;
  }
  .card img { width: 100%; height: 150px; object-fit: cover; border: 2px solid white; }
  .card-name { font-weight: bold; font-size: 16px; color: cyan; }
  .card-price { font-size: 20px; color: yellow; }
  .card-stock { font-size: 12px; }
  .card-stock.oos { color: red; text-decoration: line-through; }
  #cartWidget {
    position: fixed; bottom: 10px; right: 10px;
    background: red; color: white; padding: 8px; border-radius: 50%;
    font-size: 24px; cursor: pointer; z-index: 999;
    box-shadow: 0 0 10px yellow;
  }
  .modal {
    display: none; position: fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(255,0,255,0.8); z-index: 1000; overflow-y: auto;
  }
  .modal.open { display: block; }
  .modal-content {
    background: black; border: 8px groove orange;
    margin: 30px auto; padding: 20px; max-width: 600px; color: #0f0;
  }
  .close-btn { float: right; font-size: 30px; cursor: pointer; background: white; color: black; padding: 0 10px; }
  .spinner { border: 4px solid #f3f3f3; border-top: 4px solid red; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<h1>PRODUCTS (ugly beta)</h1>
<p style="color:white; background:#000; padding:5px;">Upgrade to premium for good looks.</p>

<div class="filter-bar" id="filters"></div>
<input type="text" id="search" placeholder="Search..." style="width:100%; padding:8px; margin-bottom:10px; background:black; color:lime; border:2px solid yellow;">

<div id="grid" class="container">Loading...</div>

<div id="cartWidget" onclick="openOrder()">🛒 <span id="cartCount">0</span></div>

<!-- Detail modal -->
<div class="modal" id="detailModal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeDetail()">&times;</span>
    <h2 id="detailName"></h2>
    <img id="detailImg" src="" style="max-width:100%; max-height:300px; border: 5px solid white;">
    <p id="detailPrice" style="font-size:24px; color:yellow;"></p>
    <p id="detailStock"></p>
    <p id="detailColors" style="display:none;"></p>
    <p id="detailInventory" style="display:none;"></p>
    <p id="detailNote" style="display:none;"></p>
    <button onclick="addToBundle()" id="orderBtnDetail">Add to Cart</button>
    <button onclick="closeDetail()">Close</button>
  </div>
</div>

<!-- Order modal -->
<div class="modal" id="orderModal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeOrder()">&times;</span>
    <h2>Request Your Bundle (ugly version)</h2>
    <div id="packageList"></div>
    <p>Contact method:</p>
    <label><input type="radio" name="contactMethod" value="snapchat" checked> Snapchat</label>
    <label><input type="radio" name="contactMethod" value="email"> Email</label>
    <input type="text" id="contact" placeholder="Your username/email" style="width:100%; background:black; color:lime;">
    <textarea id="specialInstructions" placeholder="Instructions" style="width:100%; background:black; color:lime;"></textarea>
    <div id="orderSummary" style="display:none;"></div>
    <div id="msg"></div>
    <button onclick="submitOrder(event)">SEND (maybe works)</button>
    <button onclick="closeOrder()">Cancel</button>
  </div>
</div>

<script>
const SHEETS_EXPORT = 'https://docs.google.com/spreadsheets/d/1hyKxnPr2irBYcg0dFmJeUdIX3eOn9_Mf55nlTDyin5Q/export?format=csv&gid=0';
const EMAIL = 'liamwattps@gmail.com';
const DISCORD_WEBHOOK = 'https://discord.com/api/webhooks/1499108525563969709/otzwD-2ib5bXaeHkBlPIdlxD_ZqjVgnIXkbz_DZOcji8SlhhESnl_kvfWtWowhy23BDI';

let allProducts = [];
let activeFilter = 'All';
let selected = null;
let selectedProducts = [];

async function loadProducts() {
  try {
    const res = await fetch(SHEETS_EXPORT);
    if (!res.ok) throw new Error('Failed');
    const csv = await res.text();
    parseCSV(csv);
  } catch(e) {
    document.getElementById('grid').innerHTML = 'ERROR LOADING DATA. Refresh.';
  }
}

function parseCSV(csv) {
  const lines = csv.trim().replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
  const idx = (n) => headers.indexOf(n);
  allProducts = lines.slice(1).map(line => {
    const vals = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); // basic CSV split
    return {
      name: vals[idx('name')]?.trim() || '',
      price: parseInt(vals[idx('price')]) || 0,
      category: vals[idx('category')]?.trim() || 'Other',
      colors: vals[idx('colors')]?.trim() || '',
      inventory: vals[idx('inventory')]?.trim() || '',
      note: vals[idx('note')]?.trim() || '',
      tag: vals[idx('tag')]?.trim() || '',
      inStock: (vals[idx('instock')]?.toLowerCase() !== 'false'),
      images: (vals[idx('images')]?.split('|').filter(u => u.startsWith('http')) || [])
    };
  }).filter(p => p.name);
  renderFilters();
  render();
}

function renderFilters() {
  const cats = ['All', ...new Set(allProducts.map(p => p.category))];
  document.getElementById('filters').innerHTML = cats.map(c =>
    `<button class="filter-btn ${c===activeFilter?'active':''}" onclick="setFilter('${c}')">${c}</button>`
  ).join('');
}

function setFilter(c) { activeFilter=c; renderFilters(); render(); }

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const list = allProducts.filter(p => 
    (activeFilter==='All' || p.category===activeFilter) &&
    (!q || p.name.toLowerCase().includes(q))
  );
  document.getElementById('grid').innerHTML = list.map((p,i) => {
    const idx = allProducts.indexOf(p);
    return `
    <div class="card" onclick="openDetail(${idx})">
      <img src="${p.images[0] || ''}" alt="${p.name}">
      <div class="card-name">${p.name}</div>
      <div class="card-price">$${p.price}</div>
      <div class="card-stock ${!p.inStock?'oos':''}">${p.inStock?'In Stock':'Sold Out'}</div>
      <button ${!p.inStock?'disabled':''} onclick="event.stopPropagation();quickAdd(${idx})">+ Cart</button>
    </div>`;
  }).join('');
}

function openDetail(idx) {
  selected = allProducts[idx];
  document.getElementById('detailName').textContent = selected.name;
  document.getElementById('detailPrice').textContent = `$${selected.price}`;
  document.getElementById('detailStock').textContent = selected.inStock ? 'In Stock' : 'Out of Stock';
  document.getElementById('detailImg').src = selected.images[0] || '';
  document.getElementById('detailColors').textContent = 'Colors: ' + (selected.colors || 'N/A');
  document.getElementById('detailColors').style.display = selected.colors?'block':'none';
  document.getElementById('detailInventory').textContent = 'Inventory: ' + (selected.inventory || 'N/A');
  document.getElementById('detailInventory').style.display = selected.inventory?'block':'none';
  document.getElementById('detailNote').textContent = 'Note: ' + (selected.note || 'N/A');
  document.getElementById('detailNote').style.display = selected.note?'block':'none';
  document.getElementById('orderBtnDetail').disabled = !selected.inStock;
  document.getElementById('detailModal').classList.add('open');
}

function closeDetail() { document.getElementById('detailModal').classList.remove('open'); }
function openOrder() {
  document.getElementById('detailModal').classList.remove('open');
  document.getElementById('orderModal').classList.add('open');
  updatePackageList();
}
function addToBundle() {
  if (!selected) return;
  if (!selectedProducts.find(p=>p.name===selected.name)) selectedProducts.push({...selected, selected:true});
  updateCartBadge();
  document.getElementById('orderBtnDetail').textContent = 'Added!';
  setTimeout(() => document.getElementById('orderBtnDetail').textContent = 'Add to Cart', 1000);
}
function quickAdd(idx) {
  const p = allProducts[idx];
  if (!p.inStock) return;
  if (!selectedProducts.find(x=>x.name===p.name)) selectedProducts.push({...p, selected:true});
  updateCartBadge();
}
function updateCartBadge() {
  const n = selectedProducts.length;
  document.getElementById('cartCount').textContent = n;
  document.getElementById('cartWidget').style.display = n>0?'block':'none';
}
function closeOrder() { document.getElementById('orderModal').classList.remove('open'); }
function updatePackageList() {
  const list = document.getElementById('packageList');
  if (selectedProducts.length===0) { list.innerHTML='No items'; return; }
  list.innerHTML = selectedProducts.map((p,i) => `
    <p>${p.name} - $${p.price} <button onclick="removeProduct(${i})">X</button></p>
  `).join('');
}
function removeProduct(i) { selectedProducts.splice(i,1); updatePackageList(); updateCartBadge(); }

async function submitOrder(e) {
  e.preventDefault();
  const contactMethod = document.querySelector('input[name="contactMethod"]:checked').value;
  const contact = document.getElementById('contact').value.trim();
  const notes = document.getElementById('specialInstructions').value.trim();
  if (!contact) { alert('Enter contact info'); return; }
  if (selectedProducts.length===0) { alert('Cart empty'); return; }

  const itemsStr = selectedProducts.map(p => `• ${p.name} - $${p.price}`).join('\n');
  const total = selectedProducts.reduce((s,p) => s+p.price, 0);

  const discordMsg = {
    embeds: [{
      title: '🛍️ New Ugly Bundle',
      description: `${selectedProducts.length} items, $${total}`,
      fields: [
        { name: 'Contact', value: contact, inline: true },
        { name: 'Method', value: contactMethod, inline: true },
        { name: 'Items', value: itemsStr, inline: false },
        { name: 'Notes', value: notes || 'None', inline: false }
      ]
    }]
  };

  // Fire and forget
  fetch(DISCORD_WEBHOOK, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(discordMsg)}).catch(()=>{});
  fetch(`https://formsubmit.co/ajax/${EMAIL}`, {
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify({_subject:`New Order from ${contact}`,contact,items:itemsStr,notes,total})
  }).catch(()=>{});

  document.getElementById('msg').innerHTML = '<p style="color:lime;">Sent! (maybe)</p>';
  setTimeout(() => { selectedProducts=[]; updateCartBadge(); closeOrder(); }, 2000);
}

document.getElementById('search').addEventListener('input', render);
loadProducts();
</script>

</body>
</html>
