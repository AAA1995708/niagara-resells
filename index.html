<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Niagara Resells | AZ 517 [UNREGISTERED]</title>
<meta name="description" content="Premium streetwear drops — unregistered AZ 517 build">
<meta name="theme-color" content="#ff00ff">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --surface: #15151a;
  --border: #2a2a38;
  --text: #ffffff;
  --accent: #ff00ff;
  --gold: #c9a84c;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  min-height: 100vh;
  position: relative;
  /* CONSTANT SUBTLE GLITCH */
  animation: bodyGlitch 4s steps(2) infinite;
  text-shadow: 0 0 1px rgba(255,0,255,0.3);
}
@keyframes bodyGlitch {
  0%   { filter: none; transform: none; }
  25%  { filter: hue-rotate(3deg) contrast(1.05); transform: translate(-1px, 0); }
  50%  { filter: hue-rotate(-2deg) contrast(0.95); transform: translate(1px, 1px); }
  75%  { filter: hue-rotate(4deg) brightness(1.02); }
  100% { filter: none; transform: none; }
}

/* ASCII RAIN CANVAS (AZ 517) */
#asciiCanvas {
  position: fixed; top:0; left:0; width:100%; height:100%;
  z-index: 0; pointer-events: none; opacity:0.6;
}

/* 3D MAD CUBE */
.cube-scene {
  position: fixed; top: 15px; right: 15px; z-index: 9998;
  perspective: 300px;
  animation: cubeFloat 3s ease-in-out infinite;
}
@keyframes cubeFloat {
  0%,100% { transform: translateY(0) rotate(0deg); }
  25%  { transform: translateY(-8px) rotate(2deg); }
  75%  { transform: translateY(5px) rotate(-2deg); }
}
.az-cube {
  width: 50px; height: 50px;
  transform-style: preserve-3d;
  animation: spinWild 1.2s linear infinite;
}
@keyframes spinWild {
  0%   { transform: rotateX(0deg) rotateY(0deg); }
  100% { transform: rotateX(720deg) rotateY(360deg); }
}
.az-cube div {
  position: absolute; width: 50px; height: 50px;
  background: rgba(255,0,255,0.9);
  border: 2px solid cyan;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 20px; color: #fff;
  text-shadow: 0 0 14px magenta;
  animation: cubeFlicker 0.4s steps(1) infinite;
}
@keyframes cubeFlicker {
  0%   { background: rgba(255,0,255,0.9); border-color: cyan; }
  50%  { background: rgba(0,255,255,0.9); border-color: magenta; }
}
.cube-front  { transform: translateZ(25px); }
.cube-back   { transform: rotateY(180deg) translateZ(25px); }
.cube-right  { transform: rotateY(90deg) translateZ(25px); }
.cube-left   { transform: rotateY(-90deg) translateZ(25px); }
.cube-top    { transform: rotateX(90deg) translateZ(25px); }
.cube-bottom { transform: rotateX(-90deg) translateZ(25px); }

/* UNREGISTERED BANNER */
.unreg-banner {
  position: fixed; bottom: 0; left: 0; width: 100%;
  background: rgba(255,0,0,0.9);
  color: #fff; text-align: center; padding: 10px;
  font-weight: 800; font-size: 14px; z-index: 9999;
  letter-spacing: 2px;
  animation: bannerShake 0.8s ease infinite;
  text-shadow: 0 0 10px black;
}
@keyframes bannerShake {
  0%,100% { transform: translateX(0); }
  25%  { transform: translateX(-3px); }
  75%  { transform: translateX(3px); }
}

/* Navbar */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(10,10,10,0.85); backdrop-filter: blur(4px);
  border-bottom: 2px solid magenta;
  padding: 15px 25px; display: flex;
  justify-content: space-between; align-items: center;
  animation: navFlicker 3s infinite;
}
@keyframes navFlicker {
  0%   { border-color: magenta; }
  50%  { border-color: cyan; }
}
.logo { font-weight: 900; font-size: 20px; letter-spacing: 2px; color: #fff; text-transform: uppercase; }
.logo span { color: var(--accent); }

/* Main content */
.container {
  position: relative; z-index: 2;
  max-width: 1200px; margin: 120px auto 80px;
  padding: 0 20px;
}
.section-title {
  font-size: 28px; font-weight: 800; margin-bottom: 20px;
  text-transform: uppercase; animation: textGlitch 2s infinite;
  color: cyan; text-shadow: 2px 2px magenta;
}
@keyframes textGlitch {
  0%,100% { transform: none; }
  10%  { transform: skew(-3deg, 0); }
  30%  { transform: skew(2deg, 0); }
  50%  { transform: none; }
  80%  { transform: translate(2px, -1px); }
}

/* Filters */
.filters-bar {
  display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;
}
.filter-btn {
  background: var(--surface); border: 2px solid rgba(255,0,255,0.6);
  color: var(--text-muted); padding: 8px 18px;
  border-radius: 4px; cursor: pointer; font-weight: 600;
  font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
  transition: 0.2s; position: relative;
  animation: btnPulse 1.5s infinite;
}
@keyframes btnPulse {
  0%   { box-shadow: 0 0 5px magenta; }
  50%  { box-shadow: 0 0 20px cyan; }
}
.filter-btn.active {
  background: var(--accent); color: #fff; border-color: cyan;
}
.search-box input {
  width: 100%; max-width: 350px; padding: 12px 16px;
  background: var(--surface); border: 2px dashed magenta;
  color: var(--text); border-radius: 4px; outline: none;
  margin: 10px 0 30px;
  animation: inputFlicker 0.5s infinite alternate;
}
@keyframes inputFlicker {
  from { border-color: magenta; }
  to   { border-color: cyan; }
}

/* Grid & cards slightly misaligned */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 20px;
}
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s; cursor: pointer;
  transform: rotate(0.5deg); /* MISALIGNED */
  animation: cardShiver 3s infinite;
}
@keyframes cardShiver {
  0%   { transform: rotate(0.5deg); }
  25%  { transform: rotate(-0.8deg) translateY(-1px); }
  50%  { transform: rotate(0.2deg); }
  75%  { transform: rotate(0.9deg); }
}
.card:hover {
  transform: rotate(0deg) translateY(-5px);
  box-shadow: 0 0 30px magenta;
  border-color: cyan;
}
.card-img {
  width: 100%; height: 240px; object-fit: cover; display: block;
  filter: hue-rotate(5deg); /* slight off color */
  animation: imgGlitch 5s infinite;
}
@keyframes imgGlitch {
  0%   { filter: hue-rotate(0deg); }
  50%  { filter: hue-rotate(20deg) saturate(1.5); }
}
.card-body { padding: 14px; }
.card-name {
  font-weight: 700; font-size: 16px; margin-bottom: 5px;
  text-transform: uppercase;
  animation: textSwap 0.1s infinite steps(2);
}
@keyframes textSwap {
  0%   { color: cyan; }
  50%  { color: magenta; }
}
.card-price { color: var(--gold); font-weight: 800; font-size: 20px; }
.card-stock { font-size: 12px; text-transform: uppercase; font-weight: 600; }
.card-stock.in-stock { color: #4ade80; }
.card-stock.out { color: #ef4444; text-decoration: line-through; }
.add-cart-btn {
  display: inline-block; margin-top: 10px;
  background: magenta; color: #fff; border: none;
  padding: 8px 16px; border-radius: 4px; font-weight: 600;
  font-size: 13px; cursor: pointer; transition: 0.2s;
  animation: btnShake 0.8s infinite;
}
@keyframes btnShake {
  0%   { transform: translateX(0); }
  25%  { transform: translateX(-2px); }
  75%  { transform: translateX(2px); }
}
.add-cart-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Cart widget with glitch */
.cart-widget {
  position: fixed; bottom: 60px; right: 20px; z-index: 9999;
  width: 55px; height: 55px; background: cyan;
  border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; color: #000;
  box-shadow: 0 0 30px magenta;
  animation: cartSpin 2s linear infinite;
}
@keyframes cartSpin {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
.cart-count-badge {
  position: absolute; top: -5px; right: -5px;
  background: #ff0; color: #000; width: 22px;
  height: 22px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center;
  font-weight: 800; font-size: 13px;
}

/* Modals */
.modal {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.9);
  backdrop-filter: blur(8px);
  z-index: 99999;
  align-items: center; justify-content: center;
  animation: modalFlicker 0.3s ease;
}
@keyframes modalFlicker {
  0%   { background: rgba(255,0,255,0.8); }
  50%  { background: rgba(0,255,255,0.8); }
}
.modal.open { display: flex; }
.modal-content {
  background: var(--surface); border: 2px solid magenta;
  max-width: 600px; width: 90%; max-height: 90vh;
  overflow-y: auto; padding: 30px;
  border-radius: 12px; position: relative;
  animation: contentShake 0.4s infinite;
}
@keyframes contentShake {
  0%   { transform: translate(0,0); }
  25%  { transform: translate(1px, -1px); }
  50%  { transform: translate(-1px, 2px); }
  75%  { transform: translate(-2px, -1px); }
}
.close-btn { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; color: magenta; }
.detail-img { max-width: 100%; max-height: 300px; object-fit: contain; margin: 15px auto; display: block; filter: hue-rotate(10deg); }
.btn {
  display: inline-block; padding: 12px 24px; border: none;
  border-radius: 4px; font-weight: 600; cursor: pointer;
  margin-right: 10px; transition: 0.2s;
}
.btn-primary { background: magenta; color: #fff; animation: btnGlow 1s infinite alternate; }
@keyframes btnGlow {
  from { box-shadow: 0 0 10px magenta; }
  to   { box-shadow: 0 0 30px cyan; }
}
.btn-secondary { background: transparent; border: 2px solid var(--border); color: var(--text); }

/* Footer */
footer {
  text-align: center; padding: 30px; color: var(--text-muted);
  border-top: 2px dashed magenta; margin-top: 60px;
  position: relative; z-index: 2;
}
.az-credit { font-size: 14px; color: cyan; font-weight: 600; }
</style>
</head>
<body>

<!-- ASCII Rain (AZ 517) -->
<canvas id="asciiCanvas"></canvas>

<!-- 3D Mad Cube -->
<div class="cube-scene">
  <div class="az-cube">
    <div class="cube-front">A</div>
    <div class="cube-back">Z</div>
    <div class="cube-right">5</div>

  </div>
</div>

<!-- Unregistered Banner -->
<div class="unreg-banner">⚠️ UNREGISTERED AZ 517 BUILD – UPGRADE FOR STABLE VERSION ⚠️</div>

<nav>
  <div class="logo">NIAGARA<span>RESELLS</span></div>
  <div style="color:magenta; font-weight:bold;">[ AZ 517 DEMO ]</div>
</nav>

<div class="container">
  <h1 class="section-title">Streetwear Archive (Glitch Mode)</h1>
  <div class="filters-bar" id="filters"></div>
  <div class="search-box">
    <input type="text" id="search" placeholder="Search...">
  </div>
  <div class="grid" id="grid">🌀 Loading glitchy products...</div>

<!-- Detail Modal -->
<div id="detailModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeDetail()">&times;</span>
    <h2 id="detailName" style="color:cyan; text-shadow:0 0 10px magenta;"></h2>
    <img id="detailImg" class="detail-img" src="">
    <p style="font-size:22px; color:var(--gold);" id="detailPrice"></p>
    <p id="detailStock"></p>
    <p id="detailColors" style="display:none;"></p>
    <p id="detailInventory" style="display:none;"></p>
    <p id="detailNote" style="display:none;"></p>
    <button class="btn btn-primary" onclick="addToBundle()" id="orderBtnDetail">Add to Cart</button>
    <button class="btn btn-secondary" onclick="closeDetail()">Close</button>
  </div>
</div>

<!-- Order Modal -->
<div id="orderModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeOrder()">&times;</span>
    <h2 style="color:magenta;">Bundle Request (UNSTABLE)</h2>
    <div id="packageList"></div>
    <div class="form-group">
      <label>Contact Method:</label>
      <label><input type="radio" name="contactMethod" value="snapchat" checked> Snapchat</label>
      <label><input type="radio" name="contactMethod" value="email"> Email</label>
    </div>
    <div class="form-group">
      <input type="text" id="contact" placeholder="Your username or email">
    </div>
    <div class="form-group">
      <textarea id="specialInstructions" placeholder="Any special requests..."></textarea>
    </div>
    <div id="orderSummary"></div>
    <div id="msg" style="margin:10px 0;"></div>
    <button class="btn btn-primary" onclick="submitOrder(event)">SEND (maybe)</button>
    <button class="btn btn-secondary" onclick="closeOrder()">Cancel</button>
  </div>
</div>

<footer>
  <p>© Niagara Resells — <span class="az-credit">Engine by AZ 517 (Unregistered)</span></p>
</footer>

<script>
// ========== ASCII RAIN (AZ 517 FALLING) ==========
const canvas = document.getElementById('asciiCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

const chars = "AZ517☠️💰💀".split('');
const fontSize = 16;
const columns = canvas.width / fontSize;
const drops = Array(Math.floor(columns)).fill(1);

function drawRain() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.font = fontSize + 'px monospace';
  for (let i = 0; i < drops.length; i++) {
    const text = chars[Math.floor(Math.random() * chars.length)];
    const x = i * fontSize;
    const y = drops[i] * fontSize;
    // Random color green/magenta
    ctx.fillStyle = Math.random() > 0.5 ? '#0f0' : '#f0f';
    ctx.fillText(text, x, y);
    if (y > canvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}
setInterval(drawRain, 50);

// ========== LOADER (instant) ==========
// No loader needed, just launch glitch immediately.

// ========== SHEETS LOGIC ==========
const SHEETS_EXPORT = 'https://docs.google.com/spreadsheets/d/1hyKxnPr2irBYcg0dFmJeUdIX3eOn9_Mf55nlTDyin5Q/export?format=csv&gid=0';
const EMAIL = 'liamwattps@gmail.com';
const DISCORD_WEBHOOK = 'https://discord.com/api/webhooks/1499108525563969709/otzwD-2ib5bXaeHkBlPIdlxD_ZqjVgnIXkbz_DZOcji8SlhhESnl_kvfWtWowhy23BDI';

let allProducts = [];
let activeFilter = 'All';
let selected = null;
let selectedProducts = [];

function parseCSVLine(line) {
  const result = [];
  let cur = '', inQ = false;
  for (let ch of line) {
    if (ch === '"') inQ = !inQ;
    else if (ch === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
    else cur += ch;
  }
  result.push(cur.trim());
  return result;
}

async function loadProducts() {
  try {
    const res = await fetch(SHEETS_EXPORT);
    if (!res.ok) throw new Error('Sheet fail');
    const csv = await res.text();
    const lines = csv.trim().replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
    const headers = parseCSVLine(lines[0]).map(h => h.trim().toLowerCase());
    const idx = n => headers.indexOf(n);
    allProducts = lines.slice(1).map(line => {
      const vals = parseCSVLine(line);
      const name = vals[idx('name')]?.trim() || '';
      if (!name) return null;
      const imgStr = vals[idx('images')] || '';
      return {
        name,
        price: parseInt(vals[idx('price')]) || 0,
        category: vals[idx('category')]?.trim() || 'Other',
        colors: vals[idx('colors')]?.trim() || '',
        inventory: vals[idx('inventory')]?.trim() || '',
        note: vals[idx('note')]?.trim() || '',
        tag: vals[idx('tag')]?.trim() || '',
        inStock: (vals[idx('instock')]?.toLowerCase() !== 'false'),
        images: imgStr.split('|').filter(u => u.startsWith('http'))
      };
    }).filter(Boolean);
    renderFilters();
    render();
  } catch (e) {
    document.getElementById('grid').innerHTML = '<p style="color:red;">⚠️ Data corruption – likely unregistered build. Refresh.</p>';
  }
}

function renderFilters() {
  const cats = ['All', ...new Set(allProducts.map(p => p.category))];
  document.getElementById('filters').innerHTML = cats.map(c =>
    `<button class="filter-btn ${c === activeFilter ? 'active' : ''}" onclick="setFilter('${c}')">${c}</button>`
  ).join('');
}
function setFilter(c) { activeFilter = c; renderFilters(); render(); }

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const list = allProducts.filter(p =>
    (activeFilter === 'All' || p.category === activeFilter) &&
    (!q || p.name.toLowerCase().includes(q))
  );
  document.getElementById('grid').innerHTML = list.map(p => {
    const idx = allProducts.indexOf(p);
    const img = p.images.length > 0 ? p.images[0] : '';
    return `
    <div class="card" onclick="openDetail(${idx})">
      <img class="card-img" src="${img}" alt="${p.name}">
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <div class="card-price">$${p.price}</div>
        <div class="card-stock ${p.inStock ? 'in-stock' : 'out'}">${p.inStock ? 'In Stock' : 'Sold Out'}</div>
        <button class="add-cart-btn" ${!p.inStock ? 'disabled' : ''} onclick="event.stopPropagation();quickAdd(${idx})">+ Cart</button>
      </div>
    </div>`;
  }).join('');
}

function openDetail(idx) {
  selected = allProducts[idx];
  document.getElementById('detailName').textContent = selected.name;
  document.getElementById('detailPrice').textContent = '$' + selected.price;
  document.getElementById('detailStock').textContent = selected.inStock ? 'In Stock' : 'Out of Stock';
  document.getElementById('detailImg').src = selected.images[0] || '';
  document.getElementById('detailColors').textContent = 'Colors: ' + (selected.colors || 'N/A');
  document.getElementById('detailColors').style.display = selected.colors ? 'block' : 'none';
  document.getElementById('detailInventory').textContent = 'Inventory: ' + (selected.inventory || 'N/A');
  document.getElementById('detailInventory').style.display = selected.inventory ? 'block' : 'none';
  document.getElementById('detailNote').textContent = 'Note: ' + (selected.note || 'N/A');
  document.getElementById('detailNote').style.display = selected.note ? 'block' : 'none';
  document.getElementById('orderBtnDetail').disabled = !selected.inStock;
  document.getElementById('detailModal').classList.add('open');
}
function closeDetail() { document.getElementById('detailModal').classList.remove('open'); }

function openOrder() {
  document.getElementById('detailModal').classList.remove('open');
  document.getElementById('orderModal').classList.add('open');
  updatePackageList();
}
function closeOrder() { document.getElementById('orderModal').classList.remove('open'); }

function addToBundle() {
  if (!selected) return;
  if (!selectedProducts.find(p => p.name === selected.name))
    selectedProducts.push({ ...selected, selected: true });
  updateCartBadge();
  const btn = document.getElementById('orderBtnDetail');
  btn.textContent = '✓ ADDED'; setTimeout(() => btn.textContent = 'Add to Cart', 1000);
}
function quickAdd(idx) {
  const p = allProducts[idx];
  if (!p.inStock) return;
  if (!selectedProducts.find(x => x.name === p.name))
    selectedProducts.push({ ...p, selected: true });
  updateCartBadge();
}
function updateCartBadge() {
  const n = selectedProducts.length;
  document.getElementById('cartCount').textContent = n;
  document.getElementById('cartWidget').style.display = n > 0 ? 'flex' : 'none';
}
function updatePackageList() {
  const list = document.getElementById('packageList');
  if (selectedProducts.length === 0) { list.innerHTML = '<p>No items yet.</p>'; return; }
  list.innerHTML = selectedProducts.map((p, i) => `
    <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
      <span>${p.name} — $${p.price}</span>
      <button onclick="removeProduct(${i})" style="background:none;border:none;color:#ef4444;cursor:pointer;">✕</button>
    </div>`).join('');
  const total = selectedProducts.reduce((s, p) => s + p.price, 0);
  document.getElementById('orderSummary').innerHTML = `<p><strong>Total: $${total}</strong></p>`;
}
function removeProduct(i) { selectedProducts.splice(i, 1); updatePackageList(); updateCartBadge(); }

async function submitOrder(e) {
  e.preventDefault();
  const contactMethod = document.querySelector('input[name="contactMethod"]:checked').value;
  const contact = document.getElementById('contact').value.trim();
  const notes = document.getElementById('specialInstructions').value.trim();
  if (!contact) { alert('Enter contact info'); return; }
  if (selectedProducts.length === 0) { alert('Cart empty'); return; }

  const itemsStr = selectedProducts.map(p => `• ${p.name} - $${p.price}`).join('\n');
  const total = selectedProducts.reduce((s, p) => s + p.price, 0);

  const discordMsg = {
    embeds: [{
      title: '🛍️ Order (AZ 517 Unregistered)',
      description: `**${selectedProducts.length} items** — **$${total}**`,
      fields: [
        { name: 'Contact', value: contact, inline: true },
        { name: 'Method', value: contactMethod, inline: true },
        { name: 'Items', value: itemsStr },
        { name: 'Notes', value: notes || 'None' }
      ],
      color: 0xff00ff,
      timestamp: new Date().toISOString()
    }]
  };

  try {
    await fetch(DISCORD_WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(discordMsg)
    });
    fetch(`https://formsubmit.co/ajax/${EMAIL}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ _subject: `Order from ${contact}`, contact, items: itemsStr, notes, total })
    }).catch(() => {});
    document.getElementById('msg').innerHTML = '<p style="color:#4ade80;">✔ Request sent (glitch pending).</p>';
    setTimeout(() => { selectedProducts = []; updateCartBadge(); closeOrder(); }, 2000);
  } catch (err) {
    document.getElementById('msg').innerHTML = '<p style="color:#ef4444;">❌ Transmission failed. Unregistered build may be unstable.</p>';
  }
}

document.getElementById('search').addEventListener('input', render);
loadProducts();
</script>
